<!DOCTYPE html>
<html>
<head>
    <title>ESP32 IMU 3D Visualizer</title>
    <style>
        :root {
            --accent: #00f2ff;
            --bg-dark: #0a0a0c;
            --panel-bg: rgba(20, 20, 25, 0.8);
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg-dark);
            color: #e0e0e0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Main Dashboard Panel */
        .dashboard {
            position: absolute;
            top: 25px;
            left: 25px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            min-width: 200px;
        }

        h2 {
            margin: 0 0 15px 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            opacity: 0.8;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-family: 'Courier New', monospace;
            font-size: 22px;
        }

        .label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            align-self: center;
        }

        .value {
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
        }

        /* Status Indicator */
        .status-bar {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 10px;
            background: #ff4444; /* Default Disconnected */
            box-shadow: 0 0 8px #ff4444;
            transition: all 0.3s ease;
        }

        .status-dot.connected {
            background: #00ff88;
            box-shadow: 0 0 8px #00ff88;
        }

        #status-text {
            letter-spacing: 1px;
        }

    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <div class="dashboard">
        <h2>3D Object Visualisation </h2>
        
        <div class="data-row">
            <span class="label">Roll</span>
            <span class="value"><span id="roll">0.00</span>°</span>
        </div>
        
        <div class="data-row">
            <span class="label">Pitch</span>
            <span class="value"><span id="pitch">0.00</span>°</span>
        </div>

        <div class="status-bar">
            <div id="status-dot" class="status-dot"></div>
            <span id="status-text">DISCONNECTED</span>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0c);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambient = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambient);

        const light = new THREE.DirectionalLight(0xffffff, 2);
        light.position.set(5, 5, 5);
        scene.add(light);

        // Grid (styled to match UI)
        const grid = new THREE.GridHelper(10, 20, 0x00f2ff, 0x222222);
        grid.material.opacity = 0.2;
        grid.material.transparent = true;
        scene.add(grid);

        let model;
        const loader = new GLTFLoader();

        loader.load("Lego.glb", function (gltf) {
            model = gltf.scene;
            model.scale.set(100, 100, 100);
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            model.position.sub(center);
            model.rotation.order = "YXZ";
            scene.add(model);
        });

        // --- Logic & WebSocket ---
        const rollText = document.getElementById("roll");
        const pitchText = document.getElementById("pitch");
        const statusDot = document.getElementById("status-dot");
        const statusText = document.getElementById("status-text");

        const ws = new WebSocket("ws://IP Address:81");

        ws.onopen = () => {
            console.log("WebSocket Connected");
            statusDot.classList.add("connected");
            statusText.innerText = "CONNECTED";
            statusText.style.color = "#00ff88";
        };

        ws.onclose = () => {
            console.log("WebSocket Disconnected");
            statusDot.classList.remove("connected");
            statusText.innerText = "DISCONNECTED";
            statusText.style.color = "#ff4444";
        };

        ws.onmessage = function (event) {
            let values = event.data.split(",");
            let roll = parseFloat(values[0]);
            let pitch = parseFloat(values[1]);

            rollText.innerText = roll.toFixed(2);
            pitchText.innerText = pitch.toFixed(2);

            if (model) {
                let targetX = pitch * Math.PI / 180;
                let targetZ = -roll * Math.PI / 180;

                // Smooth interpolation (logic remains as requested)
                model.rotation.x += (targetX - model.rotation.x) * 0.15;
                model.rotation.z += (targetZ - model.rotation.z) * 0.15;
            }
        };

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener("resize", function () {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
